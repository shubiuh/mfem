[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "udar-inversion"
version = "0.1.0"
description = "Python workflow for adaptive MFEM UDAR modeling and C++ ROL/TAO inversion"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
udar-invert = "udar_inversion.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
